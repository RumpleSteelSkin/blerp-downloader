name: Release

# Publishes a GitHub Release whenever a v* tag is pushed. The in-app updater
# reads /releases/latest, so this workflow is what makes updates possible.
#
# To cut a release:
#   1) bump __version__ in blerp_downloader/__init__.py
#   2) commit
#   3) git tag vX.Y.Z && git push --tags
#
# Tags containing a hyphen (v1.0.0-rc.1) are published as prereleases, which
# /releases/latest excludes - a safe staging channel no shipped app will see.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # v7 of both: the v4/v5 lines target Node.js 20, which is deprecated and
      # already being force-run on Node 24 by the runner.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        # Values arrive via env, never interpolated into the script body:
        # ${{ }} is substituted textually before PowerShell parses the script,
        # so a tag containing a quote would run as code - and it would do so
        # before the pattern below had a chance to reject it.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          $ver = $tag -replace '^v', ''
          # Deliberately strict: the previous pattern ended in `([-.+].*)?`,
          # which accepted anything at all after a hyphen.
          if ($ver -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "Tag '$tag' is not vMAJOR.MINOR.PATCH[-prerelease]"
          }
          "tag=$tag"     >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Verify __version__ matches the tag
        shell: pwsh
        env:
          WANT: ${{ steps.ver.outputs.version }}
        run: |
          $py = (python -c "import blerp_downloader as c; print(c.__version__)").Trim()
          if ($py -ne $env:WANT) {
            throw "blerp_downloader.__version__ is '$py' but the tag says '$env:WANT'. Bump __init__.py, commit, delete the tag and re-tag."
          }

      - name: Run tests
        # Before anything is built: a release must never ship from a red suite.
        run: python -m unittest discover tests -v

      - name: Build executables
        run: python build.py

      - name: Locate ISCC
        id: iscc
        shell: pwsh
        run: |
          # Inno Setup installs per-machine or per-user depending on how it was
          # installed, so check both roots before and after installing it.
          $c = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                 "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
                 "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")
          $p = $c | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $p) {
            # Pinned: this compiles the binary users execute, so it should not
            # change from one release to the next without us choosing it.
            choco install innosetup --version=6.4.3 -y --no-progress
            $p = $c | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $p) { throw "ISCC.exe not found in: $($c -join '; ')" }
          "path=$p" >> $env:GITHUB_OUTPUT

      - name: Compile installer
        shell: pwsh
        env:
          ISCC: ${{ steps.iscc.outputs.path }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: '& $env:ISCC "/DMyAppVersion=$env:VERSION" installer.iss'

      - name: Generate SHA256SUMS
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $f = "dist\installer\BlerpDownloader-Setup-$env:VERSION.exe"
          if (-not (Test-Path $f)) { throw "Installer not produced: $f" }
          # The app verifies the download against this file, so its format is a
          # contract: "<lowercase sha256>  <filename>".
          "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $(Split-Path $f -Leaf)" |
            Out-File -Encoding ascii "dist\installer\SHA256SUMS.txt"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          $installer = "dist\installer\BlerpDownloader-Setup-$env:VERSION.exe"
          $sums = "dist\installer\SHA256SUMS.txt"
          foreach ($f in @($installer, $sums)) {
            if (-not (Test-Path $f)) { throw "Missing asset: $f" }
          }

          # Built as an array rather than one command line with a conditional
          # variable: an empty '' would otherwise be passed through as an empty
          # positional argument (gh would read it as an asset path) under
          # PowerShell's Standard native-argument passing.
          # Only the installer is uploaded: the updater refuses to launch a bare
          # .exe asset, and shipping loose exes creates installed-vs-standalone drift.
          $ghArgs = @('release', 'create', $tag, '--title', $tag, '--generate-notes')
          if ($tag -like '*-*') { $ghArgs += '--prerelease' }
          $ghArgs += @($installer, $sums)

          Write-Host "gh $($ghArgs -join ' ')"
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE"
          }
